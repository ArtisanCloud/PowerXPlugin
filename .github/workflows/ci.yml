name: CI

on:
  push:
    branches: ["main", "master", "develop", "001-powerxplugin-foundation"]
  pull_request:

jobs:
  template-sync:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Install dependencies
        run: npm install
      - name: Verify template sync
        run: npm run sync:templates -- --check

  backend:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.org
      GOWORK: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Configure Go proxy
        run: |
          go env -w GOPROXY=$GOPROXY
          go env -w GOSUMDB=$GOSUMDB
      - name: Go work sync
        run: go work sync
      - name: Go test (framework)
        run: cd framework && go test ./...
      - name: Go test (skeleton backend)
        run: cd skeleton/backend && go test ./... -count=1

  frontend:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      LIGHTNINGCSS_FORCE_WASM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Install dependencies
        run: |
          npm install
          (cd skeleton/web-admin && npm install)
          # workaround: npm optionalDependencies 有概率漏装平台原生包（rollup/oxc/lightningcss/tailwind oxide），导致构建阶段找不到 native binding
          (cd skeleton/web-admin && ARCH=$(node -p "process.arch") && ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version") && OXC_VERSION=$(node -p "require('./node_modules/oxc-parser/package.json').version") && npm install --no-save "@rollup/rollup-linux-${ARCH}-gnu@${ROLLUP_VERSION}" "@oxc-parser/binding-linux-${ARCH}-gnu@${OXC_VERSION}" "@oxc-transform/binding-linux-${ARCH}-gnu@${OXC_VERSION}" "@oxc-minify/binding-linux-${ARCH}-gnu@${OXC_VERSION}" "lightningcss-linux-${ARCH}-gnu@1.30.2" "@tailwindcss/oxide-linux-${ARCH}-gnu")
      - name: Lint
        run: cd skeleton/web-admin && npm run lint
      - name: Build
        run: cd skeleton/web-admin && npm run build

  contracts:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.org
      GO111MODULE: on
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Configure Go proxy
        run: |
          go env -w GOPROXY=$GOPROXY
          go env -w GOSUMDB=$GOSUMDB
      - name: Go work sync
        run: go work sync
      - name: Run contract validators
        run: |
          cd framework
          go test ./backend/go/manifest ./backend/go/rbac
      - name: Run TaskBus contracts validator (optional)
        run: scripts/contracts/validate-taskbus-contracts.sh

  cli:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.org
      GO111MODULE: on
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Configure Go proxy
        run: |
          go env -w GOPROXY=$GOPROXY
          go env -w GOSUMDB=$GOSUMDB
      - name: Go test (cli devwatch/devapi/watch)
        run: |
          go work sync
          cd tools/cli
          go test ./internal/devwatch ./internal/devapi ./internal/watch
      - name: Build px-plugin and scaffold sample project
        run: |
          go work sync
          cd tools/cli
          go build -o ../../bin/px-plugin ./cmd/px-plugin
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          "$GITHUB_WORKSPACE/bin/px-plugin" init com.powerx.ci --force --module github.com/example/ci > /dev/null
          test -f com.powerx.ci/plugin.yaml

  smoke:
    runs-on: ubuntu-latest
    needs: [backend, contracts, cli]
    env:
      GOTOOLCHAIN: local
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Configure Go proxy
        run: |
          go env -w GOPROXY=$GOPROXY
          go env -w GOSUMDB=$GOSUMDB
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Run smoke workflow
        run: |
          make test-smoke 2>&1 | tee smoke.log
      - name: Upload smoke log
        if: ${{ always() && env.ACTIONS_RUNTIME_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: smoke.log

  regression:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    needs: [smoke]
    env:
      GOTOOLCHAIN: local
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.org
      LIGHTNINGCSS_FORCE_WASM: "1"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y make
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Configure Go proxy
        run: |
          go env -w GOPROXY=$GOPROXY
          go env -w GOSUMDB=$GOSUMDB
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Install dependencies
        run: |
          npm install
          (cd skeleton/web-admin && npm install)
          # workaround: npm optionalDependencies 有概率漏装平台原生包（rollup/oxc/lightningcss/tailwind oxide），导致构建阶段找不到 native binding
          (cd skeleton/web-admin && ARCH=$(node -p "process.arch") && ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version") && OXC_VERSION=$(node -p "require('./node_modules/oxc-parser/package.json').version") && npm install --no-save "@rollup/rollup-linux-${ARCH}-gnu@${ROLLUP_VERSION}" "@oxc-parser/binding-linux-${ARCH}-gnu@${OXC_VERSION}" "@oxc-transform/binding-linux-${ARCH}-gnu@${OXC_VERSION}" "@oxc-minify/binding-linux-${ARCH}-gnu@${OXC_VERSION}" "lightningcss-linux-${ARCH}-gnu@1.30.2" "@tailwindcss/oxide-linux-${ARCH}-gnu")
      - name: Run regression workflow
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        shell: bash
        run: |
          set -o pipefail
          make test-regression 2>&1 | tee regression.log
      - name: Upload regression artifacts
        if: ${{ always() && env.ACTIONS_RUNTIME_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: regression-artifacts
          path: |
            regression.log
            tmp/regression-backend.log
            tmp/regression-frontend.log
            tmp/coverage.html
            skeleton/web-admin/test-results/
