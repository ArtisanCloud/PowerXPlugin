name: CI

on:
  push:
    branches: ["main", "master", "develop", "001-powerxplugin-foundation", "009-consume-powerx-capability"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-termination-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frontend tooling
        run: |
          npm install --ignore-scripts
          npm --prefix skeleton/web-admin/nuxt install --ignore-scripts
      - name: Verify session contract and template synchronization
        run: |
          node scripts/contracts/validate-session-termination.mjs
          node scripts/sync-templates.mjs --check
      - name: Install Chromium for session contract
        run: node skeleton/web-admin/nuxt/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify installed SDKs, CLI output and browser protocol
        run: python3 scripts/contracts/package-session-termination.py --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework-session-termination
          path: |
            artifacts/framework-session-termination-*/references.json
            artifacts/framework-session-termination-*/validation.log
            artifacts/framework-session-termination-*/browser-validation.json

  event-fabric-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts --workspaces=false
      - run: npm run check:event-fabric
      - run: go test -race ./framework/backend/go/runtime/eventfabric/... ./framework/backend/go/runtime/taskbus ./skeleton/backend/go-gin/cmd/plugin -count=1 -timeout=120s
      - name: Verify packaged tenant Runtime without local replace
        run: python3 scripts/contracts/package-event-fabric.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-fabric-tenant-contract
          path: |
            artifacts/event-fabric-latest.json
            artifacts/framework-release-event-fabric-tenant-*/consumer-validation.log

  plugin-id-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts --workspaces=false
      - run: npm run check:plugin-id
      - run: go test ./framework/backend/go/manifest ./tools/cli/cmd ./tools/cli/internal/manifest ./tools/cli/internal/package -count=1
      - run: PX_TEST_PLUGIN_ID=1 go test ./tools/cli/internal/templates -run '^TestPluginIDGeneratedConsumers$' -count=1 -timeout=15m

  customer-auth-dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout authoritative Core protobuf contract
        uses: actions/checkout@v4
        with:
          repository: ArtisanCloud/PowerX
          ref: f99333ccd80eb3c2467fe6cc9009917340556424
          path: .ci-core
          sparse-checkout: backend/api/grpc/contracts/powerx/event_fabric/v1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify customer authentication contracts
        run: >-
          dotnet test framework/backend/dotnet/tests/PowerXPlugin.Framework.Tests/PowerXPlugin.Framework.Tests.csproj
          --configuration Release
          --filter FullyQualifiedName~Runtime.Customer
          -p:PowerXCoreGrpcContractsRoot="$GITHUB_WORKSPACE/.ci-core/backend/api/grpc/contracts"

  dist-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.CI_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install manifest tooling
        run: npm ci --ignore-scripts --workspaces=false
      - name: Verify actual Skeleton permission declarations
        run: node skeleton/scripts/manifest/check-permission-declaration.mjs --manifest skeleton/plugin.yaml
      - name: Verify artifact target and actual Go binaries
        run: node --test tests/packaging/dist-target.test.mjs

  delegated-contract-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.CI_CHECKOUT_TOKEN || github.token }}
      - name: Enforce delegated token contract (no PX_TOOL_TOKEN fallback)
        run: |
          set -euo pipefail
          TARGETS=(
            framework/backend/go/internal/integration/gateway
            skeleton/backend/go-gin/internal/config
            skeleton/backend/go-gin/internal/integrations/gateway
            skeleton/backend/go-gin/internal/transport/http/middleware
            skeleton/backend/go-gin/internal/transport/http/integration
          )
          if rg -n "PX_TOOL_TOKEN" "${TARGETS[@]}"; then
            echo "DELEGATED_SERVICE_CREDENTIAL_REQUIRED"
            exit 1
          fi

  template-sync:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.CI_CHECKOUT_TOKEN || github.token }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install dependencies
        run: npm install
      - name: Verify SDK archive inputs and Go checksums
        run: python3 -m unittest discover -s scripts/release -p 'test_framework_archive.py'
      - name: Verify template sync
        run: npm run sync:templates -- --check
      - name: Verify agent paths (no legacy skeleton refs)
        run: npm run check:agent-paths

  backend:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.org
      GOWORK: auto
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.CI_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Configure Go proxy
        run: |
          go env -w GOPROXY=$GOPROXY
          go env -w GOSUMDB=$GOSUMDB
      - name: Go work sync
        run: go work sync
      - name: Go test (framework)
        run: cd framework/backend/go && go test ./...
      - name: Go test (skeleton backend)
        run: cd skeleton/backend/go-gin && go test ./... -count=1
      - name: Generated backend with packaged Framework snapshot
        run: PX_TEST_GENERATED_BUILD=1 PX_TEST_FRAMEWORK_SNAPSHOT=1 go test ./tools/cli/internal/templates -run '^(TestGeneratedBackendBuild|TestIAMBaselineGeneratedPlugin)$' -count=1 -timeout=10m

  frontend:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      LIGHTNINGCSS_FORCE_WASM: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.CI_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install dependencies
        run: |
          npm install
          (cd skeleton/web-admin/nuxt && npm install)
          # workaround: npm optionalDependencies 有概率漏装平台原生包（rollup/oxc/lightningcss/tailwind oxide），导致构建阶段找不到 native binding
          (cd skeleton/web-admin/nuxt && ARCH=$(node -p "process.arch") && ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version") && OXC_VERSION=$(node -p "require('./node_modules/oxc-parser/package.json').version") && npm install --no-save "@rollup/rollup-linux-${ARCH}-gnu@${ROLLUP_VERSION}" "@oxc-parser/binding-linux-${ARCH}-gnu@${OXC_VERSION}" "@oxc-transform/binding-linux-${ARCH}-gnu@${OXC_VERSION}" "@oxc-minify/binding-linux-${ARCH}-gnu@${OXC_VERSION}" "lightningcss-linux-${ARCH}-gnu@1.30.2" "@tailwindcss/oxide-linux-${ARCH}-gnu")
      - name: Lint
        run: cd skeleton/web-admin/nuxt && npm run lint
      - name: Session termination contract provenance
        run: node scripts/contracts/validate-session-termination.mjs
      - name: Framework authentication and transport contract tests
        run: |
          cd skeleton/web-admin/nuxt
          npm run test:unit -- tests/unit/api-auth-errors.spec.ts tests/unit/api-auth-feedback.spec.ts tests/unit/host-session-v2.spec.ts tests/unit/bridge-v2-interoperability.spec.ts tests/unit/session-termination-v2.spec.ts tests/unit/session-termination-admin.spec.ts tests/unit/session-termination-adapter.spec.ts tests/unit/session-termination-router.spec.ts tests/unit/framework-realtime.spec.ts tests/unit/useAuth.fallback.spec.ts tests/unit/userStore.spec.ts
      - name: Build
        run: cd skeleton/web-admin/nuxt && npm run build

  contracts:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.org
      GO111MODULE: on
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.CI_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Configure Go proxy
        run: |
          go env -w GOPROXY=$GOPROXY
          go env -w GOSUMDB=$GOSUMDB
      - name: Go work sync
        run: go work sync
      - name: Run contract validators
        run: |
          cd framework
          go test ./backend/go/manifest ./backend/go/rbac
      - name: Run TaskBus contracts validator (optional)
        run: scripts/contracts/validate-taskbus-contracts.sh

  cli:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.org
      GO111MODULE: on
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.CI_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Configure Go proxy
        run: |
          go env -w GOPROXY=$GOPROXY
          go env -w GOSUMDB=$GOSUMDB
      - name: Go test (cli devwatch/devapi/watch)
        run: |
          go work sync
          cd tools/cli
          go test ./internal/devwatch ./internal/devapi ./internal/watch
      - name: Build px-plugin and scaffold sample project
        run: |
          go work sync
          cd tools/cli
          go build -o ../../bin/px-plugin ./cmd/px-plugin
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          "$GITHUB_WORKSPACE/bin/px-plugin" init com.powerx.plugins.ci --force --module github.com/example/ci > /dev/null
          test -f com.powerx.plugins.ci/plugin.yaml

  smoke:
    runs-on: ubuntu-latest
    needs: [delegated-contract-guard, backend, contracts, cli]
    env:
      GOTOOLCHAIN: local
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.CI_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Configure Go proxy
        run: |
          go env -w GOPROXY=$GOPROXY
          go env -w GOSUMDB=$GOSUMDB
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Run smoke workflow
        run: |
          make test-smoke 2>&1 | tee smoke.log
      - name: Upload smoke log
        if: ${{ always() && env.ACTIONS_RUNTIME_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: smoke.log

  regression:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    needs: [smoke]
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
      CC: gcc
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.org
      LIGHTNINGCSS_FORCE_WASM: "1"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.CI_CHECKOUT_TOKEN || github.token }}
      - name: Install system dependencies
        run: |
          sed -i \
            -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources
          getent ahosts archive.ubuntu.com
          getent ahosts security.ubuntu.com
          apt-get -o APT::Update::Error-Mode=any update
          apt-get install -y build-essential
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Configure Go proxy
        run: |
          go env -w GOPROXY=$GOPROXY
          go env -w GOSUMDB=$GOSUMDB
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install dependencies
        run: |
          npm install
          (cd skeleton/web-admin/nuxt && npm install)
          # workaround: npm optionalDependencies 有概率漏装平台原生包（rollup/oxc/lightningcss/tailwind oxide），导致构建阶段找不到 native binding
          (cd skeleton/web-admin/nuxt && ARCH=$(node -p "process.arch") && ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version") && OXC_VERSION=$(node -p "require('./node_modules/oxc-parser/package.json').version") && npm install --no-save "@rollup/rollup-linux-${ARCH}-gnu@${ROLLUP_VERSION}" "@oxc-parser/binding-linux-${ARCH}-gnu@${OXC_VERSION}" "@oxc-transform/binding-linux-${ARCH}-gnu@${OXC_VERSION}" "@oxc-minify/binding-linux-${ARCH}-gnu@${OXC_VERSION}" "lightningcss-linux-${ARCH}-gnu@1.30.2" "@tailwindcss/oxide-linux-${ARCH}-gnu")
      - name: Run regression workflow
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          REGRESSION_RUN_E2E: "0"
        shell: bash
        run: |
          set -o pipefail
          make test-regression 2>&1 | tee regression.log
      - name: Upload regression artifacts
        if: ${{ always() && env.ACTIONS_RUNTIME_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: regression-artifacts
          path: |
            regression.log
            tmp/regression-backend.log
            tmp/regression-frontend.log
            tmp/coverage.html
            skeleton/web-admin/nuxt/test-results/

  business-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Framework workspaces for peer package resolution
        run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix skeleton/web-admin/nuxt
      - name: Install Chromium for business regression
        run: cd skeleton/web-admin/nuxt && npx playwright install --with-deps chromium
      - name: Controlled business regression and generated consumers
        env:
          REGRESSION_BROWSER: '1'
        run: bash scripts/testing/regression.sh
      - name: Archive business evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-regression
          path: artifacts/regression/
