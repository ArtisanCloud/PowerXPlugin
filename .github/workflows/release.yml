name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '22.23.2'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm workspaces
        run: npm install --workspaces --include-workspace-root=false

      - name: Run Go unit tests
        run: |
          (cd framework/backend/go && go test ./...)
          (cd tools/cli && go test ./...)

      - name: Verify SDK archive inputs and checksums
        run: python3 -m unittest discover -s scripts/release -p 'test_framework_archive.py'

      - name: Verify generated backend with packaged Framework
        run: PX_TEST_GENERATED_BUILD=1 PX_TEST_FRAMEWORK_SNAPSHOT=1 go test ./tools/cli/internal/templates -run '^(TestGeneratedBackendBuild|TestIAMBaselineGeneratedPlugin)$' -count=1 -timeout=10m

      - name: Build CLI binary
        run: |
          mkdir -p dist
          go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o dist/px-plugin ./tools/cli/cmd/px-plugin

      - name: Archive CLI binary
        run: tar -czf "dist/px-plugin-${GITHUB_REF_NAME}.tar.gz" -C dist px-plugin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: px-plugin-release-${{ github.run_id }}
          path: |
            dist/px-plugin
            dist/px-plugin-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

      - name: Summary
        run: |
          cat <<'EOF' >> $GITHUB_STEP_SUMMARY
          ## Release recap
          - CLI binary built and uploaded.
          - SDK archive inputs and Go checksums verified.
          - Generated backend verified with a packaged Framework snapshot.
          EOF
