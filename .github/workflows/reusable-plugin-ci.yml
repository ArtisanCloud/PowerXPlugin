name: Reusable plugin CI

on:
  workflow_call:
    inputs:
      source_sha:
        description: Expected full commit of the caller run
        required: true
        type: string
      plugin_version:
        description: Version to write into the plugin package
        required: true
        type: string
      mode:
        description: Supported mode is build
        default: build
        type: string
      request_id:
        description: Request identifier for correlating the run and artifact
        required: true
        type: string

permissions:
  contents: read

env:
  GO_VERSION: '1.24.13'
  NODE_VERSION: '22.23.2'
  PX_PLUGIN_COMMIT: 880839e37fff9ada2765a7292f9817f01646c96c
  PX_PLUGIN_SHA256: a8837172e81c7c85d886cd34db9ad7819e818f1e3920e653c4e69d2724b83b38

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate request
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_SHA: ${{ github.sha }}
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
          MODE: ${{ inputs.mode }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          if [[ "$RUNNER_OS" != Linux || "$RUNNER_ARCH" != X64 ]]; then
            echo "::error::PLUGIN_CI_RUNNER_UNSUPPORTED"
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || "$SOURCE_SHA" != "$RUN_SHA" ]]; then
            echo "::error::PLUGIN_CI_SOURCE_MISMATCH"
            exit 1
          fi
          if [[ "$MODE" != build ]]; then
            echo "::error::PLUGIN_CI_MODE_UNSUPPORTED"
            exit 1
          fi
          if [[ ! "$REQUEST_ID" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]]; then
            echo "::error::PLUGIN_CI_REQUEST_ID_INVALID"
            exit 1
          fi
          stable_version='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ${#PLUGIN_VERSION} -gt 50 || ! "$PLUGIN_VERSION" =~ $stable_version ]]; then
            echo "::error::PLUGIN_CI_VERSION_UNSUPPORTED"
            exit 1
          fi

      - name: Check out plugin source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: plugin
          persist-credentials: false

      - name: Check out fixed CLI source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ArtisanCloud/PowerXPlugin
          ref: ${{ env.PX_PLUGIN_COMMIT }}
          path: framework-cli
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install ripgrep for dist checks
        run: |
          release=ripgrep-14.1.1-x86_64-unknown-linux-musl
          archive="$RUNNER_TEMP/$release.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            "https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/$release.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' 4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e "$archive" |
            sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" --strip-components=1 "$release/rg"

      - name: Build and verify fixed CLI
        working-directory: framework-cli
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v1
          GOENV: 'off'
          GOTOOLCHAIN: local
        run: |
          if [[ "$(git rev-parse HEAD)" != "$PX_PLUGIN_COMMIT" ]]; then
            echo "::error::PLUGIN_CI_CLI_SOURCE_MISMATCH"
            exit 1
          fi
          px_plugin="$RUNNER_TEMP/px-plugin"
          GOWORK="$PWD/go.work" go build -mod=readonly -trimpath -buildvcs=false \
            -ldflags "-X main.version=ci.$PX_PLUGIN_COMMIT" \
            -o "$px_plugin" ./tools/cli/cmd/px-plugin
          printf '%s  %s\n' "$PX_PLUGIN_SHA256" "$px_plugin" | sha256sum --check

      - name: Prepare locked dependencies
        working-directory: plugin
        env:
          GOENV: 'off'
          GOWORK: 'off'
          GOTOOLCHAIN: local
        run: |
          git ls-files --error-unmatch -- backend/go.mod backend/go.sum web-admin/package-lock.json > /dev/null
          go -C backend mod download
          npm --prefix web-admin ci --no-audit --no-fund

      - name: Plan, build, and verify the frozen package
        id: package
        working-directory: plugin
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
          REQUEST_ID: ${{ inputs.request_id }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ -z "$WORKFLOW_REF" || ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::PLUGIN_CI_WORKFLOW_IDENTITY_MISSING"
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          worktree_status="$(git status --porcelain --untracked-files=all)"
          if [[ "$checked_out_sha" != "$SOURCE_SHA" || -n "$worktree_status" ]]; then
            echo "::error::PLUGIN_CI_SOURCE_CHECKOUT_INVALID"
            exit 1
          fi

          px_plugin="$RUNNER_TEMP/px-plugin"
          printf '%s  %s\n' "$PX_PLUGIN_SHA256" "$px_plugin" | sha256sum --check
          export PATH="$RUNNER_TEMP:$PATH"
          output_dir="$(mktemp -d "$RUNNER_TEMP/plugin-build.XXXXXX")"
          uuid_filter='test("^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$")'

          plan_id="$("$px_plugin" publisher plan create --entry "$PWD" \
            --version "$PLUGIN_VERSION" --os linux --arch amd64 |
            jq -er ".data.release_plan_id | select($uuid_filter)")"

          if ! build_response="$("$px_plugin" publisher build run --entry "$PWD" --plan-id "$plan_id")"; then
            jq -r '.data.error.code // empty' <<< "$build_response"
            failed_build_id="$(jq -r ".data.build_id | strings | select($uuid_filter)" <<< "$build_response")"
            if [[ -n "$failed_build_id" ]]; then
              log_token="$(cat /proc/sys/kernel/random/uuid)"
              printf '::stop-commands::%s\n' "$log_token"
              "$px_plugin" publisher build logs --entry "$PWD" --id "$failed_build_id" |
                jq -r '.data.text' | tail -n 100 || true
              printf '::%s::\n' "$log_token"
            fi
            free -m
            df -h "$PWD" "$RUNNER_TEMP"
            if [[ -r /sys/fs/cgroup/memory.events ]]; then
              cat /sys/fs/cgroup/memory.events
            fi
            exit 1
          fi
          jq -e --arg sha "$SOURCE_SHA" --arg version "$PLUGIN_VERSION" --arg plan "$plan_id" '
            .data | select(
              .schema == "powerx.plugin-publisher-build/v1" and .stage == "ready" and .error == null
              and .release_plan_id == $plan and .version == $version
              and .target == {"os": "linux", "arch": "amd64"}
              and .source.vcs == "git" and .source.commit == $sha and .source.dirty == false
            )
          ' <<< "$build_response" > "$output_dir/build.json"
          build_id="$(jq -er ".build_id | select($uuid_filter)" "$output_dir/build.json")"

          artifact_path="work/$build_id/artifact.zip"
          "$px_plugin" publisher build verify --entry "$PWD" --id "$build_id" |
            jq -e --arg path "$artifact_path" --slurpfile build "$output_dir/build.json" '
              .data == $build[0].artifact and .data.path == $path
            ' > /dev/null

          cp -- ".px-plugin/publisher/$artifact_path" "$output_dir/artifact.zip"
          digest="$(jq -er '.artifact.sha256 | select(test("^[a-f0-9]{64}$"))' "$output_dir/build.json")"
          size="$(jq -er '.artifact.size' "$output_dir/build.json")"
          printf '%s  %s\n' "$digest" "$output_dir/artifact.zip" | sha256sum --check
          test "$(stat -c %s "$output_dir/artifact.zip")" = "$size"

          {
            printf 'Request: `%s`\n\n' "$REQUEST_ID"
            printf 'Run: `%s/%s` (attempt `%s`)\n\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Plugin source: `%s` (version `%s`)\n\n' "$SOURCE_SHA" "$PLUGIN_VERSION"
            printf 'Reusable workflow: `%s` at `%s`\n\n' "$WORKFLOW_REF" "$WORKFLOW_SHA"
            printf 'CLI: `ci.%s` (SHA256 `%s`)\n\n' "$PX_PLUGIN_COMMIT" "$PX_PLUGIN_SHA256"
            printf 'Package SHA256: `%s` (%s bytes)\n' "$digest" "$size"
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'directory=%s\n' "$output_dir" >> "$GITHUB_OUTPUT"

      - name: Upload verified plugin package and build record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-build-${{ inputs.request_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.directory }}/artifact.zip
            ${{ steps.package.outputs.directory }}/build.json
          if-no-files-found: error
