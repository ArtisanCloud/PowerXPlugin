# Logging + audit retention defaults for Publish Hub aware services

retention:
  audit:
    days: 180
    description: "Keep CLI / reviewer / installer audit logs for at least 180 days"
    cleanup_cron: "0 3 * * *"  # daily 03:00 cleanup job suggestion
  access_logs:
    days: 30
  telemetry_raw:
    days: 7

sinks:
  - name: stdout
    level: info
  - name: publish-hub-audit
    level: info
    path: /var/log/powerx/publish-hub-audit.log

notes:
  - "Retention policy mirrors framework/backend/go/runtime/common/audit/log_retention.go"
  - "Cleanup cron is provided as reference; operators may wire into their scheduler"
