id: com.powerx.plugins.base.template.read
type: API
version: 1.0.0
title_i18n:
  zh-CN: 读取模板
  zh: 读取模板
  en: Read Template
description: "读取单个模板详情的原子能力。"
description_i18n:
  zh-CN: 读取单个模板详情的原子能力。
  zh: 读取单个模板详情的原子能力。
  en: Read the details of a single template.
rbac:
  resource: base.templates
  actions: [read]
provides:
  - id: schema/input/com.powerx.plugins.base.template.read.v1
    path: schema/input/com.powerx.plugins.base.template.read.json
    kind: input
    version: 1.0.0
  - id: schema/output/com.powerx.plugins.base.template.read.v1
    path: schema/output/com.powerx.plugins.base.template.read.json
    kind: output
    version: 1.0.0
metadata:
  agent_response:
    content: '已找到模板「{{ .template.name }}」。[查看模板](/templates/crud?template_id={{ .template.id }})'
    links:
      - id: '{{ .template.id }}'
        kind: template
        label: '查看模板「{{ .template.name }}」'
        href: '/templates/crud?template_id={{ .template.id }}'
  protocols:
    rest:
      method: POST
      path: /api/v1/integration/capabilities/invoke
      description: "PowerX Gateway 统一鉴权后的插件能力入口"
    grpc:
      service: powerx.template.TemplateService
      method: GetTemplate
    agent_tool:
      id: base.template.read
      scope: agent.template.read
      transport: http
      endpoint: /api/v1/integration/capabilities/invoke
