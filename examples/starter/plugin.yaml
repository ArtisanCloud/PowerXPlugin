id: com.powerx.starter
name: PowerX Starter Plugin
version: 0.1.0
description: "Starter 插件模板"
corex_version: ">=0.1.0"
security_baseline_version: "2025.10"

data_usage:
  - purpose: starter_demo
    type: operational_log
    retention: 90d
    requires_consent: false

runtime:
  kind: process
  entry: backend/bin/plugin
  env:
    POWERX_BIND_ADDR: ${POWERX_BIND_ADDR:-:8090}
    POWERX_PROXY: "1"
    POWERX_PLUGIN_ID: "com.powerx.starter"
    POWERX_SECURITY_JWT_ISSUER: "powerx-auth"
    POWERX_SECURITY_JWT_AUDIENCE: "plugin:com.powerx.starter"
    POWERX_SECURITY_JWT_SECRET: "${POWERX_AUTH_JWTSECRET}"
  health:
    http: /healthz
    interval: 10s
    timeout: 3s

backend:
  entry: backend/bin/plugin
  port: 8090
  health: /healthz

endpoints:
  http_base_path: /api/v1

frontend:
  admin:
    kind: process
    process:
      entry: node
      args: ["./web-admin/.output/server/index.mjs"]
      env:
        NODE_ENV: production
        POWERX_PROXY: "1"
      health:
        http: /healthz
        interval: 5s
        timeout: 2s
    static_dir: web-admin/.output/public
    i18n:
      dir: web-admin/i18n
      format: i18next
      default_namespace: menus
      namespaces: [menus]
      locales: [zh-CN, en]
    menus:
      - id: plugins.starter
        title: Starter 控制台
        title_i18n:
          namespace: menus
          key: menu.starter.home
          default: Starter Home
        icon: i-heroicons-rocket-launch
        path: /intro
        route: intro
        order: 10
        required_policies: [starter:template:read]

routes:
  basePath: /api/v1
  adminManifest: /api/v1/admin/manifest
  rbac: /api/v1/admin/rbac

rbac:
  resources:
    - resource: starter:template
      actions: [read, create, update, delete]

permissions:
  - resource: starter:template
    actions: [read, create, update, delete]

agents:
  - id: starter.assistant
    plugin_id: com.powerx.starter
    name: Starter 助理
    description: Starter 插件默认 Agent
    default_tools:
      - starter.template.create

capabilities:
  provides:
    - id: starter.template.create
      version: 0.1.0
      descriptor: contracts/capabilities/starter.template.create.yaml

tools:
  - id: starter.template.create
    plugin_id: com.powerx.starter
    name: 创建模板
    description: 创建 starter 模板
    transport: http
    endpoint: ${POWERX_PLUGIN_HTTP_BASE:-/api/v1}/templates
    method: POST
    rbac_resource: starter:template

migrations:
  driver: go
  entry: backend/bin/migrate
  args: ["setup"]
  workdir: ./backend
  once: true
  timeout: 60s

assets:
  public_dir: ./web-admin/public
  webAdminPath: ./web-admin/.output

checksums:
  package_sha256: ""

signature:
  enabled: false

metadata:
  author: PowerX Starter Team
  license: MIT
