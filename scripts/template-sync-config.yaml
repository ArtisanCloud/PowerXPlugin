mappings:
  - name: web-admin
    source: skeleton/web-admin
    targets:
      - path: scaffold/templates/web/nuxt
        suffix: .tmpl
      - path: tools/cli/internal/templates/data/web/nuxt
        suffix: .tmpl
    include:
      - "app/**/*"
      - "i18n/**/*"
      - "nuxt.config.ts"
      - "package.json"
    exclude:
      - "**/__tests__/**"
      - "tests/**"
      - "node_modules/**"
      - ".nuxt/**"
      - "**/.DS_Store"
    replacements:
      - globs: ["**/*.vue"]
        regex: "{{\\s*(?!print)(.*?)\\s*}}"
        flags: "gs"
        replace: "{{ `{{ $1 }}` }}"
      - globs: ["nuxt.config.ts", "app/**/*.ts", "i18n/**/*.json", "package.json"]
        literal: "'com.powerx.plugin.base'"
        replace: "'{{ .PluginID }}'"
      - globs: ["nuxt.config.ts", "app/**/*.ts", "package.json"]
        literal: '"com.powerx.plugin.base"'
        replace: '"{{ .PluginID }}"'
      - globs: ["**/*"]
        literal: "PowerX Base Plugin"
        replace: "{{ .PluginName }}"
      - globs: ["**/*"]
        literal: "PowerX Demo Plugin"
        replace: "{{ .PluginName }}"
      - globs: ["package.json"]
        literal: "\"name\": \"powerxplugin-skeleton-web-admin\""
        replace: "\"name\": \"{{ .PluginSlug }}-web-admin\""
      - globs: ["app/app.vue"]
        literal: 'title: "PowerX Sample Plugin"'
        replace: 'title: "{{ .PluginName }}"'
      - globs: ["app/pages/_p/__plugin__/admin/index.vue"]
        literal: "欢迎使用 PowerX Sample Plugin 插件脚手架示例页面。"
        replace: "欢迎使用 {{ `{{ .PluginName }}` }} 插件脚手架示例页面。"
  - name: backend
    source: skeleton/backend
    targets:
      - path: scaffold/templates/backend/go-gin
        suffix: .tmpl
      - path: tools/cli/internal/templates/data/backend/go-gin
        suffix: .tmpl
    include:
      - "cmd/**/*.go"
      - "go.mod"
      - "go.sum"
      - "internal/**/*"
    exclude:
      - "**/*_test.go"
      - "internal/**/README.md"
    replacements:
      - globs: ["**/*.go", "go.mod", "go.sum"]
        regex: "github\\.com/powerx-plugin/powerxplugin/skeleton/backend"
        flags: "g"
        replace: "{{ .BackendModulePath }}"
      - globs: ["go.mod"]
        literal: "module github.com/powerx-plugin/powerxplugin/skeleton/backend"
        replace: "module {{ .BackendModulePath }}"
      - globs: ["internal/manifestx/manifest.go"]
        literal: 'Name: "PowerX Base Plugin"'
        replace: 'Name: "{{ .PluginName }}"'
      - globs: ["internal/manifestx/manifest.go"]
        literal: 'ID: "com.powerx.plugin.base"'
        replace: 'ID: "{{ .PluginID }}"'
      - globs: ["internal/manifestx/manifest.go"]
        literal: 'Path:  "/_p/com.powerx.plugin.base/admin/templates/intro"'
        replace: 'Path:  "/_p/{{ .PluginID }}/admin/templates/intro"'
      - globs: ["internal/manifestx/manifest.go"]
        literal: 'Path:  "/_p/com.powerx.plugin.base/admin/templates/crud"'
        replace: 'Path:  "/_p/{{ .PluginID }}/admin/templates/crud"'
      - globs: ["internal/manifestx/manifest.go.tmpl"]
        literal: 'Name: "PowerX Base Plugin"'
        replace: 'Name: "{{ .PluginName }}"'
      - globs: ["internal/manifestx/manifest.go.tmpl"]
        literal: 'ID: "com.powerx.plugin.base"'
        replace: 'ID: "{{ .PluginID }}"'
      - globs: ["internal/manifestx/manifest.go.tmpl"]
        literal: 'Version: "0.1.0"'
        replace: 'Version: "{{ .Version }}"'
      - globs: ["**/*.go"]
        literal: '{Name: "checksum"}'
        replace: '{"{{"}}Name{{"}}": "checksum"}'
      - globs: ["**/*.go"]
        literal: '{Name: "tenant_id"}'
        replace: '{"{{"}}Name{{"}}": "tenant_id"}'
      - globs: ["**/*.go"]
        literal: '{Name: "license_id"}'
        replace: '{"{{"}}Name{{"}}": "license_id"}'
      - globs: ["**/*.go"]
        literal: '{Name: "metric"}'
        replace: '{"{{"}}Name{{"}}": "metric"}'
      - globs: ["**/*.go"]
        literal: '{Name: "window"}'
        replace: '{"{{"}}Name{{"}}": "window"}'
      - globs: ["**/*.go"]
        literal: '{Name: "time_bucket"}'
        replace: '{"{{"}}Name{{"}}": "time_bucket"}'
      - globs: ["**/*.go"]
        literal: '{Name: "event_type"}'
        replace: '{"{{"}}Name{{"}}": "event_type"}'
      - globs: ["**/*.go"]
        literal: '{Name: "period_end"}'
        replace: '{"{{"}}Name{{"}}": "period_end"}'
      - globs: ["**/*.go"]
        literal: '{Name: "period_start"}'
        replace: '{"{{"}}Name{{"}}": "period_start"}'
      - globs: ["**/*.go"]
        literal: '{Name: "target_url"}'
        replace: '{"{{"}}Name{{"}}": "target_url"}'
      - globs: ["**/*.go"]
        literal: '{Name: "vendor_id"}'
        replace: '{"{{"}}Name{{"}}": "vendor_id"}'
      - globs: ["**/*.go"]
        literal: '{Name: "read", Description: "查看模板"}'
        replace: '{"{{"}}Name{{"}}": "read", Description: "查看模板"}'
      - globs: ["**/*.go"]
        literal: '{Name: "create", Description: "创建模板"}'
        replace: '{"{{"}}Name{{"}}": "create", Description: "创建模板"}'
      - globs: ["**/*.go"]
        literal: '{Name: "update", Description: "更新模板"}'
        replace: '{"{{"}}Name{{"}}": "update", Description: "更新模板"}'
      - globs: ["**/*.go"]
        literal: '{Name: "delete", Description: "删除模板"}'
