        replace: '{"{{"}}Name{{"}}": "Webhooks", Status: "healthy", Message: "All systems go"}'
      - globs: ["**/*.go"]
        literal: '{Name: "plugin_id"}'
        replace: '{"{{"}}Name{{"}}": "plugin_id"}'
      - globs: ["**/*.go"]
        literal: '{Name: "tenant_id"}'
        replace: '{"{{"}}Name{{"}}": "tenant_id"}'
      - globs: ["**/*.go"]
        literal: '{Name: "advisory_id"}'
        replace: '{"{{"}}Name{{"}}": "advisory_id"}'
      - globs: ["**/*.go"]
        literal: '{Name: "asset_key"}'
        replace: '{"{{"}}Name{{"}}": "asset_key"}'
      - globs: ["**/*.go"]
