# Skeleton 插件示例配置
# 将本文件复制为 backend/etc/config.yaml 即可覆盖默认配置。

server:
  bind_addr: ":8078"
  log_level: "debug"
  dev_mode: true

# gRPC 上游（可选，默认关闭）
grpc_upstream:
  address: "localhost:8079"
  tenant_id: 1
  use_tls: false
  connect_mode: "lazy"
  optional: true

# 插件自身 gRPC 服务（可选）
grpc_server:
  enable: true
  port: 9101
  port_max_retries: 10
  use_tls: false

gateway:
  # Skeleton 开发通常通过 px-plugin login 写入 .env.local 中的 PX_GATEWAY_BASE_URL / PX_TOOL_TOKEN / PX_TOOL_REFRESH_TOKEN / PX_TENANT_UUID。
  # 若留空则默认关闭 Gateway 调用，`PX_USE_MOCK` 可指定 media,eventfabric 等模块名称以启用内存 Mock。
  base_url: "http://127.0.0.1:8077/api/v1"
  tool_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..OVqBYyA6Y3qczC-Ncr00Az12xLP0SHz0xUQ7X2B0Yh8"
  refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..St8b7TwRtPYhWdd9-jYJIQQOxauoIenP_kMv9BzRwjc"
  tenant_uuid: "aeffc79f-e72a-4fd9-b908-5c150bce3741"
  timeout: "10s"
  user_agent: "powerx-plugin-skeleton/dev"
  use_mock: []

database:
  driver: "postgres"
  dsn: "postgres://michaelhu:zz@localhost:5432/com_powerx_plugin_base?sslmode=disable"
  schema: "public"
  maxIdleConns: 10
  maxOpenConns: 100
  connMaxLifetime: 1h
  connMaxIdleTime: 30m
  slowThreshold: 200ms
  preferSimpleProtocol: true
  prepareStmt: false
  skipDefaultTx: false
  logLevel: "silent"
  devMode: false
  healthTimeout: 5s

runtime:
  run_migrate: false

runtime_ops:
  heartbeat_seconds: 15
  heartbeat_misses: 3
  quota_window_minutes: 5
  restart_backoff_start_seconds: 5
  restart_backoff_max_seconds: 120
  log_retention_days: 7
  cpu_default: "500m"
  memory_default: "512Mi"
  network_profile: "standard"
  observability:
    loki_endpoint: ""
    tempo_endpoint: ""
  alerts:
    health_failure_rate: 0.5
    p95_latency_ms: 500
    error_rate: 0.05
    quota_usage: 0.9
    billing_anomaly: 0.2

context:
  hmac_secret: "dev-hmac-secret"
  key_id: "dev"
  jwks_url: ""
  issuer: ""
  audience: ""
  ttl: "120h"

security:
  enable_cors: true
  cors_origins:
    - "http://localhost:3031"
    - "http://127.0.0.1:3031"
  rate_limit:
    enabled: false

monitoring:
  metrics:
    enabled: true
    path: "/api/v1/admin/runtime/metrics"
  health_check:
    enabled: true
    path: "/healthz"

logging:
  level: "debug"
  format: "text"
  output: "stdout"

integration:
  idempotency:
    provider: redis
    redis_url: "redis://localhost:6379"
    ttl_hours: 24
  envelope:
    payload_threshold_bytes: 1048576
  webhook:
    retry_policy: [60, 300, 900]
    dlq_topic: "plugin.webhook.dlq"
  secrets:
    rotation_days_default: 30
  billing:
    tax_provider: stripe_tax
    stripe_tax:
      api_key: "sk_test_xxx"
      user_id: ""
      location: "US"
      api_base_url: "https://api.stripe.com"
      webhook_secret: ""
      timeout_seconds: 15
    avalara:
      user_id: ""
      license_key: ""
      company_code: ""
      environment: "sandbox"
      base_url: "https://sandbox-rest.avatax.com"
      client_id: ""
      client_secret: ""
      timeout_seconds: 15
    reconciliation:
      vendor_share: 0.8
      platform_share: 0.15
      fee_share: 0.05
      currency: "USD"
    async_queue: "marketplace.billing.async"
    http_timeout_seconds: 15
    retry_backoff_seconds: [5, 30, 120]

marketplace:
  checklist:
    graphql_path: "/api/v1/admin/marketplace/checklist/graphql"
    docs_url: "specs/006-marketplace-business/contracts/ready-checklist.graphql"
  documentation:
    overview: "specs/006-marketplace-business/quickstart.md"
    ready_checklist: "specs/006-marketplace-business/contracts/ready-checklist.graphql"
    listing_playbook: "specs/006-marketplace-business/spec.md"
  recommendation:
    enabled: false
    default_weight: 0.0
    experiment_topic: "marketplace.recommendation.experiments"
    frequency_minutes: 60
  license:
    offline_allowance_hours: 72
    cache:
      provider: redis
      redis_url: "redis://localhost:6379"
      key_prefix: "powerx:marketplace:licenses"
    reminder:
      lead_hours: 0
      channels: []

operations:
  support:
    webhook_secret: "replace-me"
    default_channels:
      - channel: "marketplace_ticket"
        address: "https://support.powerx.dev/plugins/base"
        escalates: ["agent", "engineer"]
      - channel: "vendor_email"
        address: "vendor-support@example.com"
        escalates: ["agent", "manager"]
      - channel: "emergency_hotline"
        address: "+1-800-555-0100"
        escalates: ["manager"]
  incident:
    status_page_url: "https://status.powerx.dev/plugins/base"
    security_contacts: ["security@powerx.io"]
    communication_modes: ["support_hub", "status_page", "security_email", "hotline"]
  sla:
    timezone: "UTC"
    daily_cron: "0 5 * * *"

# 如需切换到 Postgres，可以将 driver 设置为 postgres 并提供 dsn，例如：
# database:
#   driver: "postgres"
#   dsn: "postgres://powerx:powerx@localhost:5432/powerx?sslmode=disable"
#   schema: "px_plugin_base"
