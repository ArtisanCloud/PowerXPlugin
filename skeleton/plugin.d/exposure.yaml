exposure:
  channels:
    - auth: jwt
      capability: com.powerx.plugins.base.auth.me_context
      entrypoint: ${POWERX_PLUGIN_HTTP_BASE:-/api/v1}/admin/user/auth/me/context
      method: GET
      rbac: admin:read
      type: rest
    - auth: jwt
      capability: com.powerx.plugins.base.template.batch_clone
      entrypoint: ${POWERX_PLUGIN_HTTP_BASE:-/api/v1}/templates/batch-clone
      method: POST
      rbac: template:create
      type: rest
    - auth: jwt
      capability: com.powerx.plugins.base.template.create
      entrypoint: ${POWERX_PLUGIN_HTTP_BASE:-/api/v1}/templates
      method: POST
      rbac: template:create
      type: rest
    - auth: jwt
      capability: com.powerx.plugins.base.template.delete
      entrypoint: ${POWERX_PLUGIN_HTTP_BASE:-/api/v1}/templates/{id}
      method: DELETE
      rbac: template:delete
      type: rest
    - auth: jwt
      capability: com.powerx.plugins.base.template.list
      entrypoint: ${POWERX_PLUGIN_HTTP_BASE:-/api/v1}/templates
      method: GET
      rbac: template:read
      type: rest
    - auth: jwt
      capability: com.powerx.plugins.base.template.prepare
      entrypoint: ${POWERX_PLUGIN_HTTP_BASE:-/api/v1}/integration/capabilities/invoke
      method: POST
      rbac: template:read
      type: rest
    - auth: jwt
      capability: com.powerx.plugins.base.template.publish
      entrypoint: ${POWERX_PLUGIN_HTTP_BASE:-/api/v1}/templates/{id}/publish
      method: POST
      rbac: template:update
      type: rest
    - auth: jwt
      capability: com.powerx.plugins.base.template.read
      entrypoint: ${POWERX_PLUGIN_HTTP_BASE:-/api/v1}/templates/{id}
      method: GET
      rbac: template:read
      type: rest
    - auth: jwt
      capability: com.powerx.plugins.base.template.review
      entrypoint: ${POWERX_PLUGIN_HTTP_BASE:-/api/v1}/templates/{id}/review
      method: POST
      rbac: template:update
      type: rest
    - auth: jwt
      capability: com.powerx.plugins.base.template.update
      entrypoint: ${POWERX_PLUGIN_HTTP_BASE:-/api/v1}/templates/{id}
      method: PUT
      rbac: template:update
      type: rest
    - auth: jwt
      capability: com.powerx.plugins.base.template.validate
      entrypoint: ${POWERX_PLUGIN_HTTP_BASE:-/api/v1}/templates/{id}/validate
      method: POST
      rbac: template:read
      type: rest
    - auth: workflow
      capability: com.powerx.plugins.base.template.compose
      entrypoint: contracts/exposure/workflow/template-compose.json
      type: workflow
    - auth: toolgrant
      capability: com.powerx.plugins.base.template.compose
      entrypoint: contracts/exposure/mcp-tools.json
      type: agent_tool
    - auth: workflow
      capability: com.powerx.plugins.base.template.audit
      entrypoint: contracts/exposure/workflow/template-audit.json
      type: workflow
    - auth: toolgrant
      capability: com.powerx.plugins.base.template.audit
      entrypoint: contracts/exposure/mcp-tools.json
      type: agent_tool
    - auth: workflow
      capability: com.powerx.plugins.base.template.quality_distribute
      entrypoint: contracts/exposure/workflow/template-quality-distribute.json
      type: workflow
    - auth: toolgrant
      capability: com.powerx.plugins.base.template.quality_distribute
      entrypoint: contracts/exposure/mcp-tools.json
      type: agent_tool
    - auth: workflow
      capability: com.powerx.plugins.base.template.quality_distribute
      entrypoint: contracts/exposure/agent-streams/template-quality-distribute.yaml
      type: agent_stream
