permissions:
  - actions:
      - read
    resource: admin
  - actions:
      - create
      - delete
      - read
      - update
    resource: base.templates
  - actions:
      - create
      - read
    resource: integration
  - actions:
      - create
      - delete
      - read
      - update
    resource: template
rbac:
  resources:
    - actions:
        - read
      resource: admin
    - actions:
        - create
        - delete
        - read
        - update
      resource: base.templates
    - actions:
        - create
        - read
      resource: integration
    - actions:
        - create
        - delete
        - read
        - update
      resource: template
routes:
  adminManifest: /api/v1/admin/manifest
  basePath: /api/v1
  permissions:
    - method: POST
      path: /admin/notifications/test
      permission:
        action: create
        resource: integration
    - method: POST
      path: /admin/runtime/ws-bus/test-flow
      permission:
        action: create
        resource: integration
    - method: POST
      path: /admin/runtime/ws-bus/grant
      permission:
        action: create
        resource: integration
    - method: POST
      path: /admin/runtime/ws-bus/publish
      permission:
        action: create
        resource: integration
    - method: POST
      path: /admin/runtime/event-fabric/topics
      permission:
        action: create
        resource: integration
    - method: POST
      path: /integration/capabilities/invoke
      permission:
        action: create
        resource: integration
  rbac: /api/v1/admin/rbac
