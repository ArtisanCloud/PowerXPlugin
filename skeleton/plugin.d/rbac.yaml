permissions:
  - actions:
      - read
    resource: admin
  - actions:
      - create
      - delete
      - read
      - update
    resource: base.templates
  - actions:
      - create
      - read
    resource: integration
  - actions:
      - create
      - read
    resource: customer
  - actions:
      - create
      - delete
      - read
      - update
    resource: template
rbac:
  resources:
    - actions:
        - read
      resource: admin
    - actions:
        - create
        - delete
        - read
        - update
      resource: base.templates
    - actions:
        - create
        - read
      resource: integration
    - actions:
        - create
        - read
      resource: customer
    - actions:
        - create
        - delete
        - read
        - update
      resource: template
routes:
  adminManifest: /api/v1/admin/manifest
  basePath: /api/v1
  permissions:
    - method: POST
      path: /admin/notifications/test
      permission:
        action: create
        resource: integration
    - method: POST
      path: /admin/runtime/ws-bus/test-flow
      permission:
        action: create
        resource: integration
    - method: POST
      path: /admin/runtime/ws-bus/grant
      permission:
        action: create
        resource: integration
    - method: POST
      path: /admin/runtime/ws-bus/publish
      permission:
        action: create
        resource: integration
    - method: POST
      path: /admin/runtime/event-fabric/topics
      permission:
        action: create
        resource: integration
    - method: POST
      path: /integration/capabilities/invoke
      permission:
        action: create
        resource: integration
    - method: GET
      path: /admin/customers/overview
      permission:
        action: read
        resource: customer
    - method: GET
      path: /admin/customers/accounts
      permission:
        action: read
        resource: customer
    - method: POST
      path: /admin/customers/accounts
      permission:
        action: create
        resource: customer
    - method: GET
      path: /admin/customers/identities
      permission:
        action: read
        resource: customer
    - method: GET
      path: /admin/customers/memberships
      permission:
        action: read
        resource: customer
    - method: GET
      path: /admin/customers/login-events
      permission:
        action: read
        resource: customer
    - method: GET
      path: /admin/customers/mini-app-entries
      permission:
        action: read
        resource: customer
  rbac: /api/v1/admin/rbac
