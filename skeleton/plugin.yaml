id: com.powerx.plugins.base
name: PowerX Base Plugin
version: 0.1.0
description: "PowerX 基础模板插件，提供模板 CRUD、能力注册与多协议暴露示例。"
runtime:
  kind: process
  entry: backend/bin/plugin
  env:
    POWERX_PLUGIN_ID: com.powerx.plugins.base
    POWERX_SECURITY_JWT_AUDIENCE: plugin:com.powerx.plugins.base
backend:
  entry: backend/bin/plugin
  port: 8078
  health: /healthz

endpoints:
  http_base_path: /api/v1

catalogs:
  capabilities: ./plugin.d/capabilities.yaml
  exposure: ./plugin.d/exposure.yaml
  agent_tools: ./plugin.d/agent_tools.yaml
  events: ./plugin.d/events.yaml
  rbac: ./plugin.d/rbac.yaml

frontend:
  admin:
    kind: process
    process:
      entry: node
      args: ["./web-admin/.output/server/index.mjs"]
      env:
        NODE_ENV: production
        NITRO_HOST: 127.0.0.1
        POWERX_PROXY: "1"
      health:
        http: /healthz
        interval: 5s
        timeout: 2s
    static_dir: web-admin/.output/public
    i18n:
      dir: web-admin/i18n
      format: i18next
      default_namespace: menus
      namespaces:
        - menus
      locales:
        - zh-CN
        - en
    menus:
      - id: plugins.com.powerx.plugins.base
        title: PowerX Base Plugin
        title_i18n:
          namespace: menus
          key: menu.com.powerx.plugins.base.template
          default: PowerX Base Plugin Console
        icon: i-heroicons-clipboard-document-check
        path: /intro
        route: intro
        order: 20
        slot: group.plugins
        required_policies: [template:read]
        children:
          - id: plugins.com.powerx.plugins.base.intro
            title: PowerX Base Plugin Intro
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugins.base.intro
              default: PowerX Base Plugin Intro
            icon: i-heroicons-information-circle
            path: /intro
            route: intro
            order: 1
          - id: plugins.com.powerx.plugins.base.templates
            title: 模版
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugins.base.templates.title
              default: Templates
            icon: i-heroicons-clipboard-document-list
            path: /templates
            route: templates
            order: 2
            children:
              - id: plugins.com.powerx.plugins.base.templates.develop
                title: 开发介绍
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.base.templates.develop
                  default: Templates Develop Intro
                icon: i-heroicons-document-text
                path: /templates/develop
                route: templates/develop
                order: 1
              - id: plugins.com.powerx.plugins.base.templates.crud
                title: 模版 CRUD
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.base.templates.crud
                  default: Templates CRUD
                icon: i-heroicons-wrench
                path: /templates/crud
                route: templates/crud
                order: 2

assets:
  public_dir: ./web-admin/public
  webAdminPath: ./web-admin/.output

migrations:
  driver: go
  entry: backend/bin/migrate
  args: ["setup"]
  workdir: ./backend
  once: true
  timeout: 60s

checksums:
  package_sha256: ""

signature:
  enabled: false

metadata:
  author: PowerX Base Team
  license: MIT
