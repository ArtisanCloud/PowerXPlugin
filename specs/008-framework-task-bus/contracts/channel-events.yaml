# Channel Events — TaskBus Contracts (Draft)
#
# 用途：沉淀事件 Topic 与 payload 结构，供评审/对齐/CI 校验（可选）。
# 注意：本文件是契约文档，不等同于 OpenAPI。

version: 0.1.0
namespace: powerx.channel

meta:
  required:
    - tenant_uuid
    - request_id
    - source_plugin
    - trace_id
    - occurred_at
    - payload_version

topics:
  - name: powerx.channel.master.credential_inspection.v1
    description: 渠道凭证巡检结果事件（用于告警/SLA/任务中心反馈）
    payload:
      type: object
      required: [channel_id, credential_type, status]
      properties:
        channel_id: { type: string }
        credential_type: { type: string }
        expires_at: { type: string, format: date-time }
        status:
          type: string
          enum: [ok, warning, expired, invalid]
        alert_level:
          type: string
          enum: [info, warn, critical]
        details:
          type: object
          additionalProperties: true

  - name: powerx.channel.master.kpi_refreshed.v1
    description: 渠道 KPI 刷新结果（用于 dashboard/健康度评分）
    payload:
      type: object
      required: [channel_id, window, metrics]
      properties:
        channel_id: { type: string }
        window:
          type: object
          required: [start_at, end_at]
          properties:
            start_at: { type: string, format: date-time }
            end_at: { type: string, format: date-time }
        metrics:
          type: object
          additionalProperties:
            type: number
        health_score: { type: number }

  - name: powerx.channel.product.publish_task.v1
    description: SPU 发布/撤回/同步任务事件（用于任务中心/编排）
    payload:
      type: object
      required: [spu_id, action, channels]
      properties:
        spu_id: { type: string }
        version_id: { type: string }
        action:
          type: string
          enum: [publish, unpublish, sync]
        channels:
          type: array
          items: { type: string }
        task_id: { type: string }
        operator:
          type: object
          properties:
            user_id: { type: string }
            name: { type: string }
        extra:
          type: object
          additionalProperties: true

