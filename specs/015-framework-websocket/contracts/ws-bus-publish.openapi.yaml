openapi: 3.0.3
info:
  title: WS Bus Publish (Host)
  version: 1.0.0
paths:
  /api/v1/admin/runtime/internal/ws-bus/publish:
    post:
      summary: Publish WS Bus event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, payload]
              properties:
                topic:
                  type: string
                payload:
                  type: object
                tenant_uuid:
                  type: string
                trace_id:
                  type: string
      responses:
        '200':
          description: Publish result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                  message:
                    type: string
                  error:
                    nullable: true
  /api/v1/admin/runtime/internal/ws-bus/grant:
    post:
      summary: Register WS Bus topics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topics]
              properties:
                topics:
                  type: array
                  items:
                    type: string
                tenant_uuid:
                  type: string
                trace_id:
                  type: string
      responses:
        '200':
          description: Register result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                  message:
                    type: string
                  error:
                    nullable: true
