openapi: 3.0.3
info:
  title: Framework IAM Unification Contract
  version: 0.1.0
  description: >
    Unified IAM contract for standalone(local) and delegated modes.
servers:
  - url: /api/v1
paths:
  /admin/iam/mode:
    get:
      summary: Get effective IAM mode and resolution source.
      responses:
        "200":
          description: Effective mode.
  /admin/iam/context/me:
    get:
      summary: Get unified identity context for current request.
      responses:
        "200":
          description: Identity context resolved.
        "401":
          description: Unauthorized or context missing.
  /admin/iam/tenants:
    get:
      summary: List tenants (local mode) or delegated projection.
      responses:
        "200":
          description: Tenant list.
    post:
      summary: Create tenant (local mode only).
      responses:
        "201":
          description: Created.
        "405":
          description: Not allowed in delegated mode.
  /admin/iam/departments:
    get:
      summary: List departments by tenant.
      responses:
        "200":
          description: Department list.
    post:
      summary: Create department (local mode only).
      responses:
        "201":
          description: Created.
        "405":
          description: Not allowed in delegated mode.
  /admin/iam/members:
    get:
      summary: List members by tenant.
      responses:
        "200":
          description: Member list.
    post:
      summary: Create member (local mode only).
      responses:
        "201":
          description: Created.
        "405":
          description: Not allowed in delegated mode.
  /admin/iam/roles:
    get:
      summary: List roles by tenant.
      responses:
        "200":
          description: Role list.
    post:
      summary: Create role (local mode only).
      responses:
        "201":
          description: Created.
        "405":
          description: Not allowed in delegated mode.
  /admin/iam/permissions:
    get:
      summary: List permission catalog and role bindings.
      responses:
        "200":
          description: Permission list.
components:
  schemas:
    IAMMode:
      type: object
      properties:
        mode:
          type: string
          enum: [local, delegated]
        source:
          type: string
        readOnly:
          type: boolean
    IdentityContext:
      type: object
      required: [tenant_uuid, roles, permissions]
      properties:
        tenant_uuid:
          type: string
        user_id:
          type: integer
          format: int64
        member_id:
          type: integer
          format: int64
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        policy_version:
          type: string
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        trace_id:
          type: string
